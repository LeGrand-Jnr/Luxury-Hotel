<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservations – Luxury Hotel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/logo.jpg" alt="Luxury Hotel Logo" class="logo-img" />
        Luxury Hotel
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="reservations.html" class="active">Reservations</a></li>
      </ul>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </nav>
  </header>

  <section class="reservation-section">
    <h2>Make a Reservation</h2>
    <div class="reservation-wrap">
      <form class="reservation-form" id="reservationForm" method="" action="">
        <div class="form-row">
          <div class="form-group full-width">
            <label for="guestFirstName">First Name</label>
            <input id="guestFirstName" type="text" placeholder="Guest first name" required />
          </div>
          <div class="form-group full-width">
            <label for="guestLastName">Last Name</label>
            <input id="guestLastName" type="text" placeholder="Guest last name" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="guestEmail">Email Address</label>
            <input id="guestEmail" type="email" placeholder="guest@example.com" required />
          </div>
          <div class="form-group">
            <label for="guestPhone">Phone Number</label>
            <input id="guestPhone" type="tel" placeholder="+233 20 000 0000" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="arrivalDate">Arrival Date</label>
            <input id="arrivalDate" type="date" required />
          </div>
          <div class="form-group">
            <label for="departureDate">Departure Date</label>
            <input id="departureDate" type="date" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="guestsNumber">Number of Guests</label>
            <input id="guestsNumber" type="number" min="1" max="12" placeholder="1" required />
          </div>
          <div class="form-group">
            <label for="stayPlan">Stay Plan</label>
            <select id="stayPlan" required>
              <option value="">Select stay plan</option>
              <option value="Bed & Breakfast">Bed & Breakfast</option>
              <option value="Half Board">Half Board</option>
              <option value="Full Board">Full Board</option>
              <option value="Executive Suite">Executive Suite</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="roomCategory">Room / Hall Type</label>
            <select id="roomCategory" required>
              <option value="">Select preferred space</option>
              <option value="Deluxe King Room">Deluxe King Room</option>
              <option value="Executive Suite">Executive Suite</option>
              <option value="Garden Room">Garden Room</option>
              <option value="Conference Hall">Conference Hall</option>
              <option value="Dining Hall">Dining Hall</option>
              <option value="Private Event Area">Private Event Area</option>
            </select>
          </div>
          <div class="form-group">
            <label for="arrivalTime">Preferred Arrival Time</label>
            <select id="arrivalTime" required>
              <option value="">Select arrival time</option>
              <option value="12:00 PM">12:00 PM</option>
              <option value="02:00 PM">02:00 PM</option>
              <option value="04:00 PM">04:00 PM</option>
              <option value="06:00 PM">06:00 PM</option>
              <option value="08:00 PM">08:00 PM</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="specialRequest">Special Request</label>
            <textarea id="specialRequest" placeholder="Late check-in, room preference, dietary needs, event requirements..." rows="5"></textarea>
          </div>
        </div>

        <div class="reservation-button full">
          <button type="submit">Request Reservation</button>
        </div>
      </form>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">Luxury Hotel</div>
      <div class="social-links">
        <a href="#" aria-label="Facebook" class="social-icon">f</a>
        <a href="#" aria-label="Instagram" class="social-icon">in</a>
        <a href="#" aria-label="X" class="social-icon">x</a>
      </div>
      <p>&copy; 2025 Luxury Hotel. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
