<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservations – Luxury Hotel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/logo.jpg" alt="Luxury Hotel Logo" class="logo-img" />
        Luxury Hotel
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="reservations.html" class="active">Reservations</a></li>
      </ul>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </nav>
  </header>

  <section class="reservation-section">
    <h2>Make a Reservation</h2>
    <div class="reservation-wrap">
      <form class="reservation-form" id="reservationForm" method="" action="">
        <div class="full">
          <label for="guestName">Full Name</label>
          <input id="guestName" type="text" placeholder="Full Name" required />
        </div>
        <div>
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="Email" required />
        </div>
        <div>
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" placeholder="Phone" required />
        </div>
        <div>
          <label for="checkinDate">Check-in Date</label>
          <input id="checkinDate" type="date" required />
        </div>
        <div>
          <label for="checkoutDate">Check-out Date</label>
          <input id="checkoutDate" type="date" required />
        </div>
        <div>
          <label for="roomType">Room Type</label>
          <select id="roomType" required>
            <option value="">Select Room Type</option>
            <option value="standard">Standard</option>
            <option value="deluxe">Deluxe</option>
            <option value="suite">Suite</option>
          </select>
        </div>
        <div>
          <label for="guests">Guests</label>
          <input id="guests" type="number" placeholder="Number of Guests" required />
        </div>
        <div class="reservation-button full">
          <button type="submit">Confirm Reservation</button>
        </div>
      </form>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">Luxury Hotel</div>
      <div class="social-links">
        <a href="#" aria-label="Facebook" class="social-icon">f</a>
        <a href="#" aria-label="Instagram" class="social-icon">in</a>
        <a href="#" aria-label="X" class="social-icon">x</a>
      </div>
      <p>&copy; 2025 Luxury Hotel. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
